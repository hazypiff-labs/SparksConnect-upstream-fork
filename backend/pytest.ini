[pytest]
# Offline by default: tests/conftest.py starts the app (fake LLM) against a throwaway MongoDB database.
# Serial on purpose — several tests mutate shared admin config. Parallel: `pytest -n 4 -p xdist` with SPARKS_TEST_BASE_URL.
testpaths = tests
asyncio_mode = auto
addopts = -p no:cacheprovider
